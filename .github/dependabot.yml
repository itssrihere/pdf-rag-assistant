version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The LangChain packages are pinned together as a set on the 0.3 line, and each one's newer releases
      # (including langchain-postgres 0.0.19 and langchain-openai 0.3.35) need langchain-core 1.x or a newer
      # openai, so single-package PRs cannot resolve. Hold the whole family, plus openai and langsmith, until the
      # LangChain 1.x migration is done; the weekly pip-audit job (scripts/audit.sh) still flags vulnerabilities.
      - dependency-name: "langchain*"
      - dependency-name: "langsmith"
      - dependency-name: "openai"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
