version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The LangChain packages and the provider SDK they wrap must move together, so they are updated in one PR
      # (single-package PRs cannot resolve against each other's pins).
      langchain:
        patterns: ["langchain*", "openai"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # The app is tested on Python 3.12. A newer interpreter can lack prebuilt wheels for a dependency (Python 3.15
      # broke the image build on zstandard), so allow only patch updates until a newer version has been tested.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
